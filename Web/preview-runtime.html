<!doctype html>
<html lang="en">
    <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>Gor Preview Runtime</title>
      <style>
        html,
        body,
        #root {
          width: 100%;
          height: 100%;
          margin: 0;
        }

        /* A fallback canvas, not an overlay on the project's own background. */
        html {
          background: #171923;
        }

        /* Keep app margins inside the root instead of shifting the document. */
        body,
        #root {
          display: flow-root;
          background: transparent;
        }

        body {
          overflow: auto;
        }
      </style>
    </head>
  <body><div id="root"></div><script type="module" src="/src/preview/runtime/iframeRuntimeHost.ts"></script></body>
</html>
