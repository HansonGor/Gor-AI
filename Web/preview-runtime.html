<!doctype html>
<html lang="en">
    <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>Gor Preview Runtime</title>
      <style>
        html,
        body,
        #root {
          width: 100%;
          height: 100%;
          margin: 0;
        }

        /* Keep html transparent so a project's body background propagates to the
           whole scrollable canvas; the dark fallback has zero specificity and
           yields to any project body rule instead of showing below the fold. */
        :where(body) {
          background: #171923;
        }

        /* Keep app margins inside the root instead of shifting the document. */
        body,
        #root {
          display: flow-root;
        }

        #root {
          background: transparent;
        }

        body {
          overflow: auto;
        }

        /* Same native thin scrollbar as the chat sidebar and page
           (scrollbar-width/scrollbar-color in pages/chat/chat.less). Zero
           specificity, so any project scrollbar rule still wins. */
        :where(html) {
          scrollbar-width: thin;
          scrollbar-color: rgba(148, 144, 174, 0.4) transparent;
        }
      </style>
    </head>
  <body><div id="root"></div><script type="module" src="/src/preview/runtime/iframeRuntimeHost.ts"></script></body>
</html>
